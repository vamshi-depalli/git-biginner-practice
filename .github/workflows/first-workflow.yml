
name: My First CI Workflow

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print a success message
        run: echo "Hello! My first GitHub Actions workflow is running."

      - name: Check README exists
        run: test -f README.md && echo "README.md exists!"
        
        
      - name: Verify README heading
        run: grep -q "^# Git Beginner Practice$" README.md && echo "README heading check passed!"

      - name: Check DevOps notes file
        run: test -f devops-notes.txt && echo "DevOps notes file exists!"
        
      - name: Verify DevOps notes content
        run: grep -q "^Learning GitHub Actions and CI$" devops-notes.txt && echo "DevOps notes content check passed!"
        
